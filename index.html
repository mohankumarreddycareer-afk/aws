
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps CI/CD Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;

        <p>Welcome to my AWS CI/CD real-time practice project.</p>
